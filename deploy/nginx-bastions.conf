# nginx reverse proxy for BASTIONS (HTTP + WebSocket on the same location).
# Copy to /etc/nginx/sites-available/bastions, replace jeu.example.com, link it
# into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d jeu.example.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name jeu.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Overwrite (do not append) so a client cannot spoof its IP for the per-IP limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
