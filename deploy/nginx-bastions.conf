# nginx site for BASTIONS on its own subdomain, next to any other site on the
# same server (the other site's config is not touched).
#
#   sudo cp deploy/nginx-bastions.conf /etc/nginx/sites-available/bastions
#   sudo ln -s /etc/nginx/sites-available/bastions /etc/nginx/sites-enabled/bastions
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bastions.arenarow.io      # HTTPS
#
# Another domain? Replace bastions.arenarow.io below (and in the certbot line).
# The game itself must listen on 127.0.0.1:3100 (deploy/docker-compose.nginx.yml
# or deploy/bastions.service do that).

# Own variable name, so it cannot clash with a `$connection_upgrade` map that
# another site on this server already defines.
map $http_upgrade $bastions_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bastions.arenarow.io;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bastions_connection_upgrade;
        proxy_set_header Host $host;
        # Overwrite (do not append) so a client cannot spoof its IP for the per-IP limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
