# BASTIONS behind nginx on the same server (other sites keep ports 80/443/3000).
#   docker compose -f deploy/docker-compose.nginx.yml up -d --build
# The game listens on 127.0.0.1:3100 only; nginx (deploy/nginx-bastions.conf)
# publishes it. Host networking makes nginx's connections arrive from loopback,
# so the real player IP in X-Forwarded-For is trusted for the per-IP limits.
name: bastions

services:
  bastions:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "${BASTIONS_PORT:-3100}"
      HOST: "127.0.0.1"
      TRUST_PROXY: "true"
      OFFLINE_SHIELD: "true"
      # MAP_SIZE: "128"
      # START_GOLD: "220"
      # NEW_PLAYERS_PER_IP_HOUR: "3"
    volumes:
      - bastions-data:/app/data

volumes:
  bastions-data:
